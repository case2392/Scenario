<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Detailed PDF — Loan officer info</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 420px;
        margin: 24px auto;
        padding: 0 16px;
        color: #0a1f44;
      }
      h1 { font-size: 17px; margin-bottom: 4px; }
      p.lead { color: #4a4a4a; font-size: 13px; margin-top: 0; }
      label { display: block; margin-top: 12px; font-size: 12px; font-weight: 600; }
      input {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid #d0d6df;
        border-radius: 4px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 16px;
        background: #006aff;
        color: #fff;
        border: 0;
        border-radius: 4px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .saved { color: #0a8f3c; font-size: 12px; margin-left: 10px; }
    </style>
  </head>
  <body>
    <h1>Loan officer info for the PDF footer</h1>
    <p class="lead">
      Shown in the "Questions?" footer of the generated PDF. Stored locally in
      Chrome sync storage.
    </p>
    <label>Name<input id="officerName" type="text" placeholder="Justin Case" /></label>
    <label>NMLS ID<input id="officerNmls" type="text" placeholder="2182068" /></label>
    <label>Phone<input id="officerPhone" type="text" placeholder="+1 913-845-9564" /></label>
    <label>Email<input id="officerEmail" type="email" placeholder="justinca@zillowhomeloans.com" /></label>
    <div>
      <button id="save">Save</button>
      <span id="saved" class="saved" hidden>Saved.</span>
    </div>
    <script src="options.js"></script>
  </body>
</html>
